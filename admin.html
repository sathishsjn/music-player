<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Music Player — Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>

<body>
  <div id="app" class="app">
    <div id="dashboard">
      <header class="header">
        <div class="title">Music Player Admin</div>
        <div class="header-actions">
          <span id="admin-indicator" class="muted">Admin</span>
        </div>
      </header>

      <main class="main">
        <section class="summary">
          <div class="card stat" id="card-total-songs">
            <div class="stat-title">Total Songs</div>
            <div class="stat-value" id="total-songs">—</div>
          </div>

          <div class="card stat" id="card-recent">
            <div class="stat-title">Recently Added</div>
            <div class="stat-value" id="recent-list">—</div>
          </div>

          <div class="card actions">
            <div class="stat-title">Quick Actions</div>
            <div class="action-buttons">
              <button id="btn-add-song" class="btn primary">Add Song</button>
              <button id="btn-manage-songs" class="btn">Manage Songs</button>
              <button id="btn-refresh" class="btn">Refresh</button>
            </div>
          </div>
        </section>

        <section class="manage">
          <div class="manage-header">
            <h2>Song Library</h2>
            <div class="manage-controls">
              <input id="search" placeholder="Search title, artist, album" aria-label="Search songs" />
              <button id="refresh-songs" class="btn">Refresh</button>
            </div>
          </div>

          <div id="songs-container" class="songs"></div>

          <div id="empty-state" class="card empty hidden">No songs found.</div>
        </section>
      </main>
    </div>

    <!-- Modals -->
    <div id="modal-root"></div>

    <!-- Toasts -->
    <div id="toasts" aria-live="polite" class="toasts"></div>
  </div>

  <script src="admin.js" defer></script>
</body>

</html>
