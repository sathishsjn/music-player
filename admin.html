<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta name="theme-color" content="#09090d" />

  <title>Music Player — Admin</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <link rel="stylesheet" href="admin.css" />
</head>

<body>

  <div id="app" class="app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

      <div class="brand">

        <div class="brand-icon">
          <i class="fa-solid fa-music"></i>
        </div>

        <div>
          <div class="title">Music Player</div>
          <div class="subtitle">Admin Panel</div>
        </div>

      </div>

      <button
        id="btn-header-refresh"
        class="icon-btn"
        type="button"
        aria-label="Refresh"
      >
        <i class="fa-solid fa-rotate"></i>
      </button>

    </header>


    <!-- =====================================================
         DASHBOARD
    ====================================================== -->

    <main class="main">

      <!-- Stats -->

      <section class="summary">

        <div class="stat-card">

          <div class="stat-icon">
            <i class="fa-solid fa-music"></i>
          </div>

          <div>
            <div class="stat-title">Total Songs</div>
            <div id="total-songs" class="stat-value">—</div>
          </div>

        </div>


        <div class="stat-card">

          <div class="stat-icon">
            <i class="fa-solid fa-clock"></i>
          </div>

          <div>
            <div class="stat-title">Recently Added</div>
            <div id="recent-list" class="stat-value recent-value">
              —
            </div>
          </div>

        </div>

      </section>


      <!-- ===================================================
           QUICK ACTIONS
      ==================================================== -->

      <section class="quick-actions">

        <button
          id="btn-add-song"
          class="action-btn primary"
          type="button"
        >
          <i class="fa-solid fa-plus"></i>
          <span>Add Song</span>
        </button>

        <button
          id="btn-manage-songs"
          class="action-btn"
          type="button"
        >
          <i class="fa-solid fa-list"></i>
          <span>Manage Songs</span>
        </button>

        <button
          id="btn-refresh"
          class="action-btn"
          type="button"
        >
          <i class="fa-solid fa-rotate"></i>
          <span>Refresh</span>
        </button>

      </section>


      <!-- ===================================================
           SONG LIBRARY
      ==================================================== -->

      <section class="manage">

        <div class="manage-header">

          <div>

            <h2>
              <i class="fa-solid fa-layer-group"></i>
              Song Library
            </h2>

            <div id="library-count" class="library-count">
              0 songs
            </div>

          </div>

        </div>


        <!-- Search -->

        <div class="search-box">

          <i class="fa-solid fa-magnifying-glass"></i>

          <input
            id="search"
            type="search"
            placeholder="Search title, artist or album"
            autocomplete="off"
          />

          <button
            id="clear-search"
            class="clear-search hidden"
            type="button"
            aria-label="Clear search"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>

        </div>


        <!-- Filters -->

        <div class="filter-row">

          <button
            class="filter-btn active"
            data-sort="newest"
            type="button"
          >
            <i class="fa-solid fa-clock"></i>
            Newest
          </button>

          <button
            class="filter-btn"
            data-sort="oldest"
            type="button"
          >
            <i class="fa-solid fa-arrow-down-1-9"></i>
            Oldest
          </button>

          <button
            class="filter-btn"
            data-sort="az"
            type="button"
          >
            A-Z
          </button>

          <button
            class="filter-btn"
            data-sort="za"
            type="button"
          >
            Z-A
          </button>

        </div>


        <!-- Songs -->

        <div id="songs-container" class="songs"></div>


        <!-- Empty -->

        <div
          id="empty-state"
          class="empty hidden"
        >
          <i class="fa-solid fa-music"></i>

          <h3>No songs found</h3>

          <p>
            Try another search or add a new song.
          </p>

          <button
            id="empty-add-song"
            class="btn primary"
            type="button"
          >
            <i class="fa-solid fa-plus"></i>
            Add Song
          </button>

        </div>

      </section>

    </main>


    <!-- =====================================================
         MODAL ROOT
    ====================================================== -->

    <div id="modal-root"></div>


    <!-- =====================================================
         TOASTS
    ====================================================== -->

    <div
      id="toasts"
      class="toasts"
      aria-live="polite"
    ></div>


    <!-- =====================================================
         AUDIO PREVIEW
    ====================================================== -->

    <audio id="preview-audio" preload="metadata"></audio>

  </div>


  <script src="admin.js" defer></script>

</body>

</html>
