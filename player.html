<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Now Playing | Music Player</title>
    <link rel="stylesheet" href="player.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
</head>

<body>

    <main class="player">

        <!-- TOP BAR -->
        <header class="player-topbar">

            <button type="button" class="top-btn" id="closePlayerBtn" aria-label="Close player">
                <i class="fa-solid fa-chevron-down"></i>
            </button>

            <div class="top-title">
                NOW PLAYING
            </div>

            <button class="top-btn" id="moreBtn" aria-label="More options">
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </button>

        </header>


        <!-- COVER -->
        <section class="cover-section">

            <div class="cover-wrapper">

                <div class="cover-glow"></div>

                <img id="cover" src="assets/images/cover8.jpg" alt="Album Cover" class="cover">

            </div>

        </section>


        <!-- SONG INFORMATION -->
        <section class="song-section">

            <div class="song-text">

                <h1 id="title">
                    Melody Song
                </h1>

                <p id="artist">
                    Anirudh Ravichander
                </p>

            </div>


            <div class="song-actions">



                <button id="favoriteBtn" class="action-btn" aria-label="Favorite">
                    <i class="fa-regular fa-heart"></i>
                </button>

            </div>

        </section>


        <!-- AUDIO -->
        <audio id="audio" preload="metadata"></audio>


        <!-- PROGRESS -->
        <section class="progress-section">

            <input type="range" id="progress" min="0" max="100" value="0" step="0.1">

            <div class="time-row">

                <span id="current">
                    0:00
                </span>

                <span id="duration">
                    0:00
                </span>

            </div>

        </section>


        <!-- CONTROLS -->
        <section class="controls">

            <button id="shuffle" class="control-btn secondary" aria-label="Shuffle">
                <i class="fa-solid fa-shuffle"></i>
            </button>


            <button id="prev" class="control-btn" aria-label="Previous">
                <i class="fa-solid fa-backward-step"></i>
            </button>


            <button id="play" class="play-btn" aria-label="Play">
                <i id="playIcon" class="fa-solid fa-play"></i>
            </button>


            <button id="next" class="control-btn" aria-label="Next">
                <i class="fa-solid fa-forward-step"></i>
            </button>


            <button id="playlistBtn" class="control-btn secondary" aria-label="Playlist">
                <i class="fa-solid fa-list"></i>
            </button>

        </section>


        <!-- PLAYLIST -->
        <section class="playlist-panel" id="playlistPanel">

            <div class="playlist-header">

                <div>
                    <span>YOUR MUSIC</span>

                    <h2>
                        Playlist
                    </h2>
                </div>

                <button id="closePlaylist" aria-label="Close playlist">
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>

            <div class="playlist-count">
                <span id="songCount">0 Songs</span>
            </div>

            <ul id="playlist" class="playlist"></ul>

        </section>

    </main>


    <!-- MORE MENU -->
    <div class="more-menu" id="moreMenu">

        <button id="closeMore">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <button>
            <i class="fa-solid fa-circle-info"></i>
            Song information
        </button>

        <button>
            <i class="fa-solid fa-share-nodes"></i>
            Share
        </button>

    </div>


    <script src="player.js"></script>

</body>

</html>
