<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Playing | Music Player</title>
    <link rel="stylesheet" href="player.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">
        <a href="index.html" class="logo">
            <i class="fa-solid fa-music"></i>
            <span>Music Player</span>
        </a>

        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Home</span>
        </a>

    </header>

    <!-- =========================
         PLAYER PAGE
    ========================== -->

    <main class="player-page">
        <section class="player-card">

            <!-- NOW PLAYING -->

            <div class="now-playing">
                <span>
                    NOW PLAYING
                </span>
            </div>

            <!-- ALBUM ART -->

            <div class="album-container">
                <div class="album-glow"></div>
                <img id="cover" src="assets/images/cover8.jpg" alt="Album Cover" class="album-cover">
            </div>

            <!-- SONG DETAILS -->

            <div class="song-info">
                <h1 id="title">
                    Melody Song
                </h1>
                <p id="artist">
                    Anirudh Ravichander
                </p>
            </div>



            <!-- AUDIO -->

            <audio id="audio"></audio>

            <!-- PROGRESS -->

            <div class="progress-container">
                <span id="current">
                    0:00
                </span>

                <input type="range" id="progress" value="0" min="0" step="0.1">

                <span id="duration">
                    0:00
                </span>

            </div>

            <!-- CONTROLS -->

            <div class="controls">
                <button id="prev" aria-label="Previous Song">
                    <i class="fa-solid fa-backward-step"></i>
                </button>


                <button id="play" class="main-play" aria-label="Play Song">
                    <i id="playIcon" class="fa-solid fa-play"></i>
                </button>


                <button id="next" aria-label="Next Song">
                    <i class="fa-solid fa-forward-step"></i>
                </button>

            </div>



            <!-- PLAYLIST -->

            <section class="playlist-section">
                <div class="playlist-heading">
                    <div>
                        <span>
                            YOUR MUSIC
                        </span>

                        <h2>
                            <i class="fa-solid fa-list"></i>
                            Playlist
                        </h2>

                    </div>

                    <span id="songCount">
                        0 Songs
                    </span>

                </div>


                <ul id="playlist" class="playlist"></ul>

            </section>


        </section>

    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <div class="footer-logo">

            <i class="fa-solid fa-music"></i>

            <span>
                Music Player
            </span>

        </div>


        <p>
            Your music. Your mood. Your beat.
        </p>


        <div class="footer-line"></div>


        <p class="copyright">

            © 2026 Music Player

            <span>•</span>

            Designed & Developed by
            <strong>SATHISH S</strong>

        </p>



    </footer>

    <!-- =================================
         MOBILE BOTTOM NAVIGATION
    ================================== -->

    <nav class="mobile-nav" aria-label="Mobile navigation">

        <a href="index.html" class="mobile-nav-item" aria-label="Home">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>

        <a href="search.html" class="mobile-nav-item mobile-nav-center" aria-label="Music">
            <i class="fa-solid fa-music"></i>
            <span>Music</span>
        </a>

        <a href="#" class="mobile-nav-item" aria-label="Profile">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>

    </nav>

    <script src="player.js"></script>

</body>

</html>
